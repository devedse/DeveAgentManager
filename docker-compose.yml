# DeveAgentManager: one file to run the Manager.
# 1. Create the Proxmox API token (see README.md, "Proxmox setup").
# 2. Fill in the values marked CHANGE ME.
# 3. The image is private (like the repo): log in once with a GitHub token that has read:packages:
#      echo <token> | docker login ghcr.io -u devedse --password-stdin
# 4. docker compose up -d, then open http://<this-host>:8080
#    First-start password: use the setup code from docker compose logs. See README.md for public HTTPS setup.
services:
  deveagentmanager:
    image: ghcr.io/devedse/deveagentmanager:latest
    container_name: deveagentmanager
    restart: unless-stopped
    ports:
      - "8080:8080" # the Portal
      - "8081:8081" # Optional local editor port. Public Portal + editors both use 8080.
    volumes:
      # Database, encryption keys and the Manager's SSH key. Back this up.
      - deveagentmanager-data:/data
    environment:
      TZ: Europe/Amsterdam

      # The first user, with all roles. The password only counts at the very first start; afterwards everyone changes
      # theirs in the Portal. RESET_ADMIN_PASSWORD: "true" gives this user all roles and ADMIN_PASSWORD again (remove it after).
      ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: choose-a-strong-initial-password # optional; otherwise a random setup code is logged
      # RESET_ADMIN_PASSWORD: "true"

      # Proxmox API (token from README.md)
      PROXMOX_URL: https://proxmox1:8006 # CHANGE ME
      PROXMOX_TOKEN_ID: deveagentmanager@pve!manager
      PROXMOX_TOKEN_SECRET: 00000000-0000-0000-0000-000000000000 # CHANGE ME
      PROXMOX_VERIFY_TLS: "false" # Proxmox uses a self-signed certificate by default
      PROXMOX_POOL: deveagents
      PROXMOX_STORAGE: ReplicatedPool_2 # disk storage for new Runners; empty = the template's storage
      PROXMOX_VMID_RANGE: 30000-30999 # Runners only get VMIDs from this range
      # PROXMOX_NODE: proxmox1       # empty = the node the template is on
      # PROXMOX_BRIDGE: vmbr0        # empty = keep the template's network
      # PROXMOX_FULL_CLONE: "true"

      # Runner Templates (Proxmox template VMIDs)
      TEMPLATE_HEADLESS_VMID: "10100"
      TEMPLATE_DESKTOP_VMID: "10120"

      # Runner Account, created on every new VM through cloud-init (each Runner gets a random password of its own)
      RUNNER_USERNAME: remoteman

      # Default size of new Runners (can be changed per Runner)
      RUNNER_DEFAULT_CORES: "4"
      RUNNER_DEFAULT_MEMORY_MB: "8192"
      RUNNER_DEFAULT_DISK_GB: "64"

      # Public HTTPS setup (configure once; one wildcard NPM host per editor domain covers EVERY Runner).
      # PUBLIC_ORIGINS: https://dam.example.com;https://dam.example.net
      # EDITOR_URL: https://{runner}.code.{host}   # behind Cloudflare: https://dam-vscode-{runner}.example.com
      # TRUSTED_PROXIES: 192.168.1.20 # actual NPM socket address, NOT every private network
      # ALLOW_LOCAL_ACCESS: "true" # direct LAN IP HTTP keeps separate local cookies; proxy traffic cannot use it
      # PROXY_IDENTITY_HEADERS: X-Custom-Authenticated-User # extra identity headers to strip at editor proxy

      # Each person's git identity, GitHub token, environment variables and SSH keys are set in the Portal (My settings).

volumes:
  deveagentmanager-data:
