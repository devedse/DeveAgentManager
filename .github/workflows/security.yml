name: Security checks
on:
  workflow_call:
    inputs:
      skip-image-checks:
        description: 'The release workflow runs image checks against its already-built production image'
        type: boolean
        default: false
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
  packages: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check verified diagnostic downloads
        run: python3 -m unittest discover -s tools/cpu-profiler -p 'test_download*.py'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Audit all NuGet dependencies (high/critical and audit failures fail)
        run: dotnet restore DeveAgentManager.slnx --force-evaluate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify and audit vendored browser addons
        run: |
          npm ci --ignore-scripts
          npm run build
          npm audit --audit-level=high
          npm ci --prefix tools/browser-dependencies --ignore-scripts
          node .typescript/tools/browser-dependencies/verify.mjs
          npm audit --prefix tools/browser-dependencies --audit-level=high
  image:
    if: ${{ !inputs.skip-image-checks }}
    uses: ./.github/workflows/image-security.yml
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [portal, interop, cpu-startup]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix tools/security-browser --ignore-scripts
      - run: npm audit --prefix tools/security-browser --audit-level=high
      - run: npx --prefix tools/security-browser playwright install --with-deps chromium
      - run: dotnet publish DeveAgentManager/DeveAgentManager.csproj -c Release -o .validation/publish
      - name: Check Damagochi throws and offline playground
        if: matrix.suite == 'interop'
        run: npm run test:pets
      - run: node .typescript/tools/security-browser/check.mjs
        if: matrix.suite == 'portal'
      - name: Check browser suite
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
        run: node .typescript/tools/security-browser/continuations.mjs "$BROWSER_SUITE"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures-${{ matrix.suite }}
          path: .validation/browser
          if-no-files-found: ignore
