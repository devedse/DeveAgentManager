name: GitHubActionsBuilds

on: push

jobs:
  generate_version_number:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ github.ref == 'refs/heads/master' && steps.buildnumber.outputs.build_number || 1 }}
    steps:
    - name: Generate build number
      if: github.ref == 'refs/heads/master'
      id: buildnumber
      uses: onyxmueller/build-tag-number@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build DeveAgentManager.slnx -c Release
    - name: Test
      run: dotnet test --solution DeveAgentManager.slnx -c Release --no-build

  build_docker:
    needs: [generate_version_number, build_and_test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: devedse
        password: ${{ secrets.DOCKERHUBTOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        image: tonistiigi/binfmt:latest
        platforms: all
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Set Image Tags
      id: tags
      run: |
        VERSION=1.0.${{ needs.generate_version_number.outputs.build_number }}
        BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')
        echo "Version: $VERSION, branch: $BRANCH_NAME"
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

        if [[ "${{ github.ref }}" == 'refs/heads/master' ]]; then
          echo "TAGS=-t devedse/deveagentmanager:${VERSION} -t devedse/deveagentmanager:latest -t devedse/deveagentmanager:beta_nightly" >> $GITHUB_OUTPUT
        elif [[ "${{ github.actor }}" == 'dependabot[bot]' ]]; then
          echo "TAGS=-t devedse/deveagentmanager:beta_${BRANCH_NAME}" >> $GITHUB_OUTPUT
        else
          echo "TAGS=-t devedse/deveagentmanager:beta_${BRANCH_NAME} -t devedse/deveagentmanager:beta_nightly" >> $GITHUB_OUTPUT
        fi
    - name: Build and push
      run: |
        docker buildx build -f Dockerfile \
          --build-arg BUILD_VERSION=${{ steps.tags.outputs.VERSION }} \
          --platform linux/arm64,linux/amd64 \
          ${{ steps.tags.outputs.TAGS }} \
          ${{ (github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && '--push' || '' }} .

  release_github:
    permissions:
      contents: write
    needs: [generate_version_number, build_docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: 1.0.${{ needs.generate_version_number.outputs.build_number }}
        name: 1.0.${{ needs.generate_version_number.outputs.build_number }}
        body: |
          ${{ github.event.head_commit.message }}

          Docker image: `devedse/deveagentmanager:1.0.${{ needs.generate_version_number.outputs.build_number }}`
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
