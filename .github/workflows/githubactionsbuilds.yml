name: Build and release

on:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner for .NET tests and the AMD64 image (ARM64 always uses a native GitHub runner)'
        required: false
        default: 'github-hosted'
        type: choice
        options:
          - github-hosted
          - self-hosted

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/devedse/deveagentmanager

jobs:
  prepare:
    name: Prepare version and image metadata
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ github.ref == 'refs/heads/master' && format('1.0.{0}', steps.buildnumber.outputs.build_number) || format('1.0.{0}-beta', steps.buildnumber.outputs.build_number) }}
      image_tags: ${{ steps.meta.outputs.tags }}
      image_labels: ${{ steps.meta.outputs.labels }}
      image_annotations: ${{ steps.meta.outputs.annotations }}
    steps:
    - uses: actions/checkout@v6
    - name: Generate build number
      id: buildnumber
      uses: onyxmueller/build-tag-number@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Prepare Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY_IMAGE }}
        tags: |
          type=raw,value=1.0.${{ steps.buildnumber.outputs.build_number }},enable=${{ github.ref == 'refs/heads/master' }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          type=raw,value=beta_nightly,enable=${{ github.actor != 'dependabot[bot]' }}
          type=raw,value=beta,enable=${{ github.ref != 'refs/heads/master' }}
          type=ref,event=branch,prefix=beta_,enable=${{ github.ref != 'refs/heads/master' }}
        labels: |
          maintainer=${{ github.actor }}
          org.opencontainers.image.description=DeveAgentManager - run coding agents on Proxmox VMs from your browser
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index

  build_and_test:
    name: .NET build and tests
    needs: prepare
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "proxmox", "medium"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore
      run: dotnet restore DeveAgentManager.slnx
    - name: Build
      env:
        BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      run: dotnet build DeveAgentManager.slnx -c Release --no-restore /p:Version="$BUILD_VERSION"
    - name: Install isolated SSH and tmux test tools
      run: |
        sudo apt-get update
        sudo apt-get install -y openssh-server tmux
        sudo install -d -m 0755 /run/sshd
    - name: Test
      run: dotnet test --solution DeveAgentManager.slnx -c Release --no-build --verbosity normal

  build_images:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    # Build each production image on its own architecture; no emulation or test image.
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          machine: x86_64
          runner: ubuntu-24.04
        - arch: arm64
          machine: aarch64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch == 'amd64' && inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "proxmox", "xlarge"]') || matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
    - name: Verify native runner architecture
      env:
        EXPECTED_MACHINE: ${{ matrix.machine }}
      run: test "$(uname -m)" = "$EXPECTED_MACHINE"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build production image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: final
        platforms: linux/${{ matrix.arch }}
        push: true
        tags: ${{ env.REGISTRY_IMAGE }}:build-${{ github.run_id }}-${{ matrix.arch }}
        labels: ${{ needs.prepare.outputs.image_labels }}
        build-args: |
          BUILD_VERSION=${{ needs.prepare.outputs.version }}
        provenance: false
        sbom: false

  security:
    name: Security and browser checks
    uses: ./.github/workflows/security.yml

  publish_image:
    name: Publish multi-architecture image
    needs: [prepare, build_and_test, build_images, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@v4
    - name: Publish tags after all checks pass
      env:
        BUILD_RUN: ${{ github.run_id }}
        IMAGE_TAGS: ${{ needs.prepare.outputs.image_tags }}
        IMAGE_ANNOTATIONS: ${{ needs.prepare.outputs.image_annotations }}
      run: |
        sources=("$REGISTRY_IMAGE:build-$BUILD_RUN-amd64" "$REGISTRY_IMAGE:build-$BUILD_RUN-arm64")
        args=()
        while IFS= read -r tag; do
          [[ -z "$tag" ]] || args+=(--tag "$tag")
        done <<< "$IMAGE_TAGS"
        while IFS= read -r annotation; do
          [[ -z "$annotation" ]] || args+=(--annotation "$annotation")
        done <<< "$IMAGE_ANNOTATIONS"
        docker buildx imagetools create "${args[@]}" "${sources[@]}"

  release_github:
    name: Create GitHub release
    permissions:
      contents: write
    needs: [prepare, publish_image]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.prepare.outputs.version }}
        name: ${{ needs.prepare.outputs.version }}
        target_commitish: ${{ github.sha }}
        body: |
          ${{ github.event.head_commit.message }}

          Docker image: `ghcr.io/devedse/deveagentmanager:${{ needs.prepare.outputs.version }}`
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
