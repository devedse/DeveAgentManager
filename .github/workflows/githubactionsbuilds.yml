name: GitHubActionsBuilds

on:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use'
        required: false
        default: 'github-hosted'
        type: choice
        options:
          - github-hosted
          - self-hosted

jobs:
  generate_version_number:
    permissions:
      contents: write
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "proxmox", "medium"]') || 'ubuntu-latest' }}
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
      # One counter for every branch (the build-number-N tag): master 1.0.<N>, other branches 1.0.<N>-beta.
      version: ${{ github.ref == 'refs/heads/master' && format('1.0.{0}', steps.buildnumber.outputs.build_number) || format('1.0.{0}-beta', steps.buildnumber.outputs.build_number) }}
    steps:
    - name: Generate build number
      id: buildnumber
      uses: onyxmueller/build-tag-number@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  build_and_test:
    needs: generate_version_number
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "proxmox", "medium"]') || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: dotnet restore
      run: dotnet restore DeveAgentManager.slnx
    - name: dotnet build
      run: dotnet build DeveAgentManager.slnx -c Release --no-restore /p:Version=${{ needs.generate_version_number.outputs.version }}
    - name: Install isolated SSH test server
      run: |
        sudo apt-get update
        sudo apt-get install -y openssh-server
        sudo install -d -m 0755 /run/sshd
    - name: dotnet test
      run: dotnet test --solution DeveAgentManager.slnx -c Release --no-build --verbosity normal

  build_docker:
    needs: [generate_version_number, build_and_test]
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "proxmox", "xlarge"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        image: tonistiigi/binfmt:latest
        platforms: all
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/devedse/deveagentmanager
        # master: its version and latest (what the compose file runs). Other branches never touch those: they get
        # "beta" (the newest branch build) and "beta_<branch>" (sanitized, so any branch name is a valid tag).
        tags: |
          type=raw,value=1.0.${{ needs.generate_version_number.outputs.build_number }},enable=${{ github.ref == 'refs/heads/master' }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          type=raw,value=beta_nightly,enable=${{ github.actor != 'dependabot[bot]' }}
          type=raw,value=beta,enable=${{ github.ref != 'refs/heads/master' }}
          type=ref,event=branch,prefix=beta_,enable=${{ github.ref != 'refs/heads/master' }}
        labels: |
          maintainer=${{ github.actor }}
          org.opencontainers.image.description=DeveAgentManager - run coding agents on Proxmox VMs from your browser
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: |
          BUILD_VERSION=${{ needs.generate_version_number.outputs.version }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        provenance: false
        sbom: false

  release_github:
    permissions:
      contents: write
    needs: [generate_version_number, build_and_test, build_docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: 1.0.${{ needs.generate_version_number.outputs.build_number }}
        name: 1.0.${{ needs.generate_version_number.outputs.build_number }}
        body: |
          ${{ github.event.head_commit.message }}

          Docker image: `ghcr.io/devedse/deveagentmanager:1.0.${{ needs.generate_version_number.outputs.build_number }}`
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
