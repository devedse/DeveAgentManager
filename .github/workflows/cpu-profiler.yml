name: CPU profiler diagnostics (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Native CPU attribution (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        context: .
        target: cpu-smoke
        platforms: linux/${{ matrix.arch }}
        load: true
        tags: dam-cpu-smoke:validation
    - name: Check CPU attribution, cancellation and idle timers
      run: tools/cpu-profiler/verify-container.sh dam-cpu-smoke:validation "$RUNNER_TEMP/cpu-profiler"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: cpu-profiler-${{ matrix.arch }}
        path: ${{ runner.temp }}/cpu-profiler
        if-no-files-found: ignore
        retention-days: 3
